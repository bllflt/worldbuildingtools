services:
  db:
    image: postgres:18
    restart: always
    container_name: PostgreSQL
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-passwd
    secrets:
      - postgres-passwd
    volumes:
      - ./data:/var/lib/postgresql
    ports:
      - "5432:5432"
  redis:
    image: redis:latest
    restart: always
    container_name: Redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
  nginx:
    image: nginx:latest
    restart: always
    container_name: nginx 
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      -  /Users/joel/Documents/wbcr/images/:/images
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
    - "80:80"
    - "443:443"
secrets:
  postgres-passwd:
    file: ./secrets/postgres-passwd.txt

volumes:
  data:
  redis_data:
